# Unit tests for hallmark/hallmark-profile.mjs (the fail-closed wrapper around sloplint). No network, no Chrome, no
# secrets: the linter is a stub in the tests. Runs only when the wrapper or its workflows change.
name: hallmark-selftest

on:
  pull_request:
    paths:
      - 'hallmark/**'
      - '.github/workflows/hallmark-shared.yml'
      - '.github/workflows/hallmark-selftest.yml'

permissions:
  contents: read

jobs:
  unit:
    name: hallmark wrapper tests
    runs-on: coolify-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: node --test hallmark
        run: node --test "hallmark/test/*.test.mjs"
