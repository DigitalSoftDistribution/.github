# Reusable CI workflow — typecheck + lint + test.
# Called by every repo's .github/workflows/ci.yml as `uses:`.
# Build is intentionally OMITTED — Coolify owns build+deploy on push to main
# (webhook-driven). GitHub Actions never builds prod artifacts.
name: ci-shared
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"
      pnpm-version:
        type: string
        default: "9"
      package-manager:
        description: "pnpm | npm | yarn"
        type: string
        default: "pnpm"
      skip-tests:
        description: "Set to true for repos without a test suite"
        type: boolean
        default: false
      runner:
        description: "runs-on label — self-hosted coolify-ci pool by default (0 cloud minutes). Override to ubuntu-latest only if a job needs the hosted image."
        type: string
        default: "coolify-ci"
      main_runner:
        type: string
        default: "coolify-ci-main"
        description: >
          runs-on label for a PUSH to the repository's default branch, used only while `runner` is the plain shared
          pool (`coolify-ci`); a caller that names any other runner keeps it. "" keeps main on `runner`.
          Why (G-218, 2026-10-27): main's ci + security runs queued 10-26 min for a runner behind ~220 pull-request
          jobs on the same `coolify-ci` label (kf security 21 min, zephr ci 26 min), and the merge gate holds every
          green PR of the repo until main's run settles: 92 green PRs waited with 0 merges a round. `coolify-ci-main`
          is the beast main lane (gha-runner-main@21..28, beast-infra ci/install-lanes.sh): a pull-request job asking
          for `coolify-ci` reaches only the lane runners lent to the shared pool (/etc/beast-ci/lanes-shared).
          Schedule / workflow_dispatch / pull_request runs stay on `runner`; merge_group runs follow `mq_runner`.
      mq_runner:
        type: string
        default: ""
        description: >
          runs-on label for a MERGE QUEUE run (event merge_group), used only while `runner` is the plain shared pool
          (`coolify-ci`); a caller that names any other runner keeps it. "" (the default) takes the configuration variable
          CI_MQ_RUNNER instead. In a called workflow `vars` are the CALLER repository's (repository or organisation level;
          GitHub docs, Variables: "For reusable workflows, the variables from the caller workflow's repository are used"),
          so a repo or the org opts in by setting CI_MQ_RUNNER, with no caller change. When both are empty the run stays on
          `runner`, so no merge group waits on a label nobody named. One label, a merge-queue pool such as coolify-ci-mq.
          A trusted lane (any label containing coolify-ci-main, coolify-ci-deploy or coolify-ci-hotfix) is never used:
          those runners hold deploy rights and merge-group code is not on main yet. Such a value keeps the job on `runner`
          and fails it in its first step, before checkout (the same lanes beast-infra's ci-vars refuses).
          Why (G-218 T-13997, 2026-11-17): merge_group jobs waited behind pull-request jobs on `coolify-ci` while merges
          stopped; beast runners reserved for merge groups carry the label coolify-ci-mq.
      skip_heavy_on_draft:
        type: boolean
        default: true
        description: >
          On a DRAFT pull request, skip the heavy jobs (they report "skipped"); they run when the PR is marked ready.
          This needs `ready_for_review` in the caller's `pull_request` types: without that trigger, marking a PR ready
          starts no new run and the draft's skipped checks would be its latest. A caller without it passes false.
          Why (G-218 CI stall, 2026-10-27): 117 of 217 queued beast-infra PR runs were on drafts while ready PRs waited
          50+ minutes for a runner. Default true since 2026-11-17 (T-13997): all 11 callers of this workflow in the org
          (read 17.11) list ready_for_review and none passed this input, so none needed a change; a new caller must list
          ready_for_review or pass false.
      allow-scratch-paths:
        description: "Set to true only for a repo that tracks a scratch / probe / output tree on purpose (the scratch guard is then off)"
        type: boolean
        default: false

jobs:
  # The one cheap signal a draft gets when skip_heavy_on_draft is on: says why `ci` was skipped. Seconds, no checkout.
  draft:
    if: ${{ inputs.skip_heavy_on_draft && github.event.pull_request.draft }}
    runs-on: ${{ (inputs.main_runner != '' && inputs.runner == 'coolify-ci' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && inputs.main_runner || inputs.runner }}
    timeout-minutes: 2
    steps:
      - run: |
          echo "draft pull request: typecheck, lint and test run once it is marked ready (skip_heavy_on_draft)"
          echo "- draft: \`ci\` runs when this PR is marked ready" >> "$GITHUB_STEP_SUMMARY"

  ci:
    if: ${{ !(inputs.skip_heavy_on_draft && github.event.pull_request.draft) }}
    # Runner: a push to the default branch goes to main_runner and a merge group to mq_runner / vars.CI_MQ_RUNNER (never a
    # trusted lane: see the guard step), both only while `runner` is the plain pool; every other run stays on `runner`.
    # The folded lines are ONE expression (same indent, so YAML joins them with single spaces).
    runs-on: >-
      ${{ (inputs.main_runner != '' && inputs.runner == 'coolify-ci' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && inputs.main_runner
      || (inputs.runner == 'coolify-ci' && github.event_name == 'merge_group' && (inputs.mq_runner || vars.CI_MQ_RUNNER) != ''
      && !contains(inputs.mq_runner || vars.CI_MQ_RUNNER, 'coolify-ci-main')
      && !contains(inputs.mq_runner || vars.CI_MQ_RUNNER, 'coolify-ci-deploy')
      && !contains(inputs.mq_runner || vars.CI_MQ_RUNNER, 'coolify-ci-hotfix')) && (inputs.mq_runner || vars.CI_MQ_RUNNER)
      || inputs.runner }}
    # Superseded pull-request runs are cancelled (T-13997): one group per caller workflow, PR and input set, with
    # cancel-in-progress on pull_request only. Every other event gets a group of its own run (run_id), so a push to main or
    # a merge group is never grouped with a PR run and never cancelled. Job level: in a called workflow `github.workflow` is
    # the CALLER's name, and the ci-shared- prefix keeps this group apart from every caller's own workflow-level group
    # (GitHub docs, reusing workflows: the same group in caller and called workflow cancels the caller). The inputs keep
    # two calls with different inputs in one caller workflow from cancelling each other.
    concurrency:
      group: ci-shared-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}-${{ inputs.package-manager }}-${{ inputs.node-version }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    # Typecheck + lint + test run serially in this single job with no turbo
    # remote cache, so large monorepos (e.g. keyflow, tracklayer) rebuild
    # upstream packages cold for each phase. History: 10m -> 20m -> 40m. 20m
    # was still killing keyflow mid-Test on the 3cpu coolify-ci runners (real
    # incident 2026-07-23: all branches cancelled at exactly 20m0s). 40m gives
    # headroom on the largest monorepos. (Longer-term: enable turbo remote
    # cache to cut the 3x cold-rebuild time and pull this back down.)
    timeout-minutes: 40
    env:
      # Raise V8 heap so `tsc --noEmit` / eslint don't SIGABRT (exit 134, OOM)
      # on large codebases. ubuntu-latest has ~16GB RAM; 6GB leaves headroom.
      NODE_OPTIONS: --max-old-space-size=6144
      # Vitest 4 starts os.availableParallelism() workers. A coolify-ci runner container sees all 96 host cores (cpuset
      # 0-95) under a 4-core quota and 10 GiB, so a test run forked about 95 workers. Cap at the quota (T-13824, 16.11).
      VITEST_MAX_WORKERS: "4"
    steps:
      # MERGE QUEUE RUNNER GUARD (T-13997): a trusted lane named in mq_runner / vars.CI_MQ_RUNNER fails the merge group
      # here, on the shared runner the runs-on expression fell back to, before any merge-group code is checked out.
      - name: Merge queue runner guard
        if: github.event_name == 'merge_group' && inputs.runner == 'coolify-ci'
        shell: bash
        env:
          MQ_RUNNER: ${{ inputs.mq_runner || vars.CI_MQ_RUNNER }}
        run: |
          lc=$(printf '%s' "$MQ_RUNNER" | tr '[:upper:]' '[:lower:]')
          case "$lc" in
            *coolify-ci-main*|*coolify-ci-deploy*|*coolify-ci-hotfix*)
              echo "::error title=Merge queue runner::mq_runner / vars.CI_MQ_RUNNER is '$MQ_RUNNER', a trusted lane (main, deploy, hotfix). Those runners hold deploy rights and merge-group code is not on main yet. Name a merge-queue pool such as coolify-ci-mq, or leave both empty for the shared pool."
              exit 1 ;;
          esac
          echo "merge queue runner: '${MQ_RUNNER:-}' (empty = the shared pool), this job on ${RUNNER_NAME:-unknown}"

      - uses: actions/checkout@v4

      # SCRATCH GUARD (G-218, 2026-10-26): a PR never ADDS files under an agent's scratch, probe or output tree.
      # mailbox-layer PR #267 carried 207 probe copies under .scratch/ (+53,023 of its +55,982 lines), committed by a
      # stage-everything checkpoint. Only added paths are judged (a repo that already tracks one is not broken by it).
      - name: Scratch guard
        if: github.event_name == 'pull_request' && !inputs.allow-scratch-paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA" >/dev/null 2>&1 || true
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "scratch guard: base $BASE_SHA not reachable -- skipped"
            exit 0
          fi
          added=$(git diff --name-only --diff-filter=A "$BASE_SHA" HEAD | grep -E '(^|/)(\.scratch|kf-out|\.kf-out|kf-artifacts|\.kf-evidence)/|\.(orig|rej)$' || true)
          if [ -n "$added" ]; then
            n=$(printf '%s\n' "$added" | wc -l | tr -d ' ')
            echo "::error title=Scratch guard::this PR adds $n file(s) under a scratch / probe / output tree (.scratch/, kf-out/, kf-artifacts/, .kf-evidence/, *.orig, *.rej). Remove them (git rm -r --cached <dir>) and add the dir to .gitignore."
            printf '%s\n' "$added" | head -40
            exit 1
          fi
          echo "scratch guard: no scratch, probe or output files added"

      - uses: pnpm/action-setup@v4
        if: inputs.package-manager == 'pnpm'
        with:
          version: ${{ inputs.pnpm-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          # No actions/cache on the self-hosted pool (G-218 BUILD-CACHE-8C, 2026-11-03). Every coolify-ci runner index keeps a
          # warm pnpm store / npm cache on local disk (beast-infra docs/beast/CI-RUNNERS.md "Warm caches"), so `cache:` only
          # restored a tarball over a store that was already warm and, after the job, its post step tarred and gzipped the
          # WHOLE index cache: 386 s of a 1301 s tracklayer job here, ending in "Unable to reserve cache ... another job may be
          # creating this cache" when another job had saved the key first. A runner outside the pool (runner: ubuntu-latest)
          # has no warm local cache and keeps it. `&&` / `||` returns the operand, so this is the package manager or "".
          cache: ${{ (!startsWith(inputs.runner, 'coolify-ci') && inputs.package-manager) || '' }}

      - name: Install deps
        shell: bash
        run: |
          PM="${{ inputs.package-manager }}"
          if [ "$PM" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          elif [ "$PM" = "yarn" ]; then
            yarn install --frozen-lockfile
          else
            npm install --prefer-offline --no-audit --no-fund
          fi

      - name: Type check
        shell: bash
        run: |
          PM="${{ inputs.package-manager }}"
          if grep -q '"typecheck"' package.json; then
            $PM run typecheck
          else
            echo "no typecheck script — falling back to tsc --noEmit"
            npx --no-install tsc --noEmit
          fi

      - name: Lint
        shell: bash
        run: |
          PM="${{ inputs.package-manager }}"
          if grep -q '"lint"' package.json; then
            $PM run lint
          else
            echo "no lint script defined — skipping"
          fi

      - name: Test
        if: ${{ !inputs.skip-tests }}
        shell: bash
        run: |
          PM="${{ inputs.package-manager }}"
          if grep -q '"test"' package.json; then
            # NOTE: no `--if-present` here — the grep guard above already
            # handles a missing script. With pnpm, a trailing `--if-present`
            # is forwarded into the test runner's argv (e.g. `vitest run
            # --if-present`), which errors with "Unknown option".
            $PM run test
          else
            echo "no test script — skipping"
          fi
