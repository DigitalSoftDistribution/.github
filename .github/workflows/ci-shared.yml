# Reusable CI workflow — typecheck + lint + test.
# Called by every repo's .github/workflows/ci.yml as `uses:`.
# Build is intentionally OMITTED — Coolify owns build+deploy on push to main
# (webhook-driven). GitHub Actions never builds prod artifacts.
name: ci-shared
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"
      pnpm-version:
        type: string
        default: "9"
      package-manager:
        description: "pnpm | npm | yarn"
        type: string
        default: "pnpm"
      skip-tests:
        description: "Set to true for repos without a test suite"
        type: boolean
        default: false
      runner:
        description: "runs-on label — self-hosted coolify-ci pool by default (0 cloud minutes). Override to ubuntu-latest only if a job needs the hosted image."
        type: string
        default: "coolify-ci"
      main_runner:
        type: string
        default: "coolify-ci-main"
        description: >
          runs-on label for a PUSH to the repository's default branch, used only while `runner` is the plain shared
          pool (`coolify-ci`); a caller that names any other runner keeps it. "" keeps main on `runner`.
          Why (G-218, 2026-10-27): main's ci + security runs queued 10-26 min for a runner behind ~220 pull-request
          jobs on the same `coolify-ci` label (kf security 21 min, zephr ci 26 min), and the merge gate holds every
          green PR of the repo until main's run settles: 92 green PRs waited with 0 merges a round. `coolify-ci-main`
          is the beast main lane (gha-runner-main@21..28, beast-infra ci/install-lanes.sh): a pull-request job asking
          for `coolify-ci` reaches only the lane runners lent to the shared pool (/etc/beast-ci/lanes-shared).
          Schedule / workflow_dispatch / pull_request runs stay on `runner`.
      skip_heavy_on_draft:
        type: boolean
        default: false
        description: >
          On a DRAFT pull request, skip the heavy jobs (they report "skipped"); they run when the PR is marked ready.
          Turn it on ONLY in the same change that adds `ready_for_review` to the caller's `pull_request` types: without
          that trigger, marking a PR ready starts no new run and the draft's skipped checks would be its latest.
          The caller's token also needs pull-requests: read: the `draft` job reads the PR, because the payload can be
          stale (T-5808), and without that read a draft reads red.
          Why (G-218 CI stall, 2026-10-27): 117 of 217 queued beast-infra PR runs were on drafts while ready PRs waited
          50+ minutes for a runner.
      allow-scratch-paths:
        description: "Set to true only for a repo that tracks a scratch / probe / output tree on purpose (the scratch guard is then off)"
        type: boolean
        default: false

jobs:
  # The one cheap signal a draft gets when skip_heavy_on_draft is on: says why `ci` was skipped. Seconds, no checkout.
  draft:
    if: ${{ inputs.skip_heavy_on_draft && github.event.pull_request.draft }}
    runs-on: ${{ (inputs.main_runner != '' && inputs.runner == 'coolify-ci' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && inputs.main_runner || inputs.runner }}
    timeout-minutes: 2
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # `ci` is skipped once we are here, and the payload can be stale: on a push followed by `gh pr ready` within
          # seconds a run's payload still says draft (T-5808). Anything but the API's `true` is red, never a green skip.
          live=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .draft 2>/dev/null || true)
          if [ "$live" != true ]; then
            echo "::error title=draft state::the payload says draft, the PR reads ${live:-unreadable}: typecheck, lint and test did not run on this head. Mark it draft and ready again to run them."
            exit 1
          fi
          echo "draft pull request: typecheck, lint and test run once it is marked ready (skip_heavy_on_draft)"
          echo "- draft: \`ci\` runs when this PR is marked ready" >> "$GITHUB_STEP_SUMMARY"

  ci:
    if: ${{ !(inputs.skip_heavy_on_draft && github.event.pull_request.draft) }}
    runs-on: ${{ (inputs.main_runner != '' && inputs.runner == 'coolify-ci' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && inputs.main_runner || inputs.runner }}
    # Typecheck + lint + test run serially in this single job with no turbo
    # remote cache, so large monorepos (e.g. keyflow, tracklayer) rebuild
    # upstream packages cold for each phase. History: 10m -> 20m -> 40m. 20m
    # was still killing keyflow mid-Test on the 3cpu coolify-ci runners (real
    # incident 2026-07-23: all branches cancelled at exactly 20m0s). 40m gives
    # headroom on the largest monorepos. (Longer-term: enable turbo remote
    # cache to cut the 3x cold-rebuild time and pull this back down.)
    timeout-minutes: 40
    env:
      # Raise V8 heap so `tsc --noEmit` / eslint don't SIGABRT (exit 134, OOM)
      # on large codebases. ubuntu-latest has ~16GB RAM; 6GB leaves headroom.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # SCRATCH GUARD (G-218, 2026-10-26): a PR never ADDS files under an agent's scratch, probe or output tree.
      # mailbox-layer PR #267 carried 207 probe copies under .scratch/ (+53,023 of its +55,982 lines), committed by a
      # stage-everything checkpoint. Only added paths are judged (a repo that already tracks one is not broken by it).
      - name: Scratch guard
        if: github.event_name == 'pull_request' && !inputs.allow-scratch-paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA" >/dev/null 2>&1 || true
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "scratch guard: base $BASE_SHA not reachable -- skipped"
            exit 0
          fi
          added=$(git diff --name-only --diff-filter=A "$BASE_SHA" HEAD | grep -E '(^|/)(\.scratch|kf-out|\.kf-out|kf-artifacts|\.kf-evidence)/|\.(orig|rej)$' || true)
          if [ -n "$added" ]; then
            n=$(printf '%s\n' "$added" | wc -l | tr -d ' ')
            echo "::error title=Scratch guard::this PR adds $n file(s) under a scratch / probe / output tree (.scratch/, kf-out/, kf-artifacts/, .kf-evidence/, *.orig, *.rej). Remove them (git rm -r --cached <dir>) and add the dir to .gitignore."
            printf '%s\n' "$added" | head -40
            exit 1
          fi
          echo "scratch guard: no scratch, probe or output files added"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        if: inputs.package-manager == 'pnpm'
        with:
          version: ${{ inputs.pnpm-version }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}

      - name: Install deps
        shell: bash
        run: |
          PM="${{ inputs.package-manager }}"
          if [ "$PM" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          elif [ "$PM" = "yarn" ]; then
            yarn install --frozen-lockfile
          else
            npm install --prefer-offline --no-audit --no-fund
          fi

      - name: Type check
        shell: bash
        run: |
          PM="${{ inputs.package-manager }}"
          if grep -q '"typecheck"' package.json; then
            $PM run typecheck
          else
            echo "no typecheck script — falling back to tsc --noEmit"
            npx --no-install tsc --noEmit
          fi

      - name: Lint
        shell: bash
        run: |
          PM="${{ inputs.package-manager }}"
          if grep -q '"lint"' package.json; then
            $PM run lint
          else
            echo "no lint script defined — skipping"
          fi

      - name: Test
        if: ${{ !inputs.skip-tests }}
        shell: bash
        run: |
          PM="${{ inputs.package-manager }}"
          if grep -q '"test"' package.json; then
            # NOTE: no `--if-present` here — the grep guard above already
            # handles a missing script. With pnpm, a trailing `--if-present`
            # is forwarded into the test runner's argv (e.g. `vitest run
            # --if-present`), which errors with "Unknown option".
            $PM run test
          else
            echo "no test script — skipping"
          fi
