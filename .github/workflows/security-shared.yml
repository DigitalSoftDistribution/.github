# Reusable security workflow — gitleaks (secrets) + npm audit (deps) + CodeQL (SAST) + trivy
# (vuln/secret/misconfig) + optional ZAP baseline (DAST against a PR preview).
# Called by each repo's .github/workflows/security.yml as `uses:`.
#
# Design goals:
#  - Never block merges on infra/licensing gaps we don't control. Secret + SAST
#    findings should surface as warnings/annotations, not hard CI failures, until
#    the org enables the corresponding paid/repo-level features.
#  - trivy is the one HARD gate added here (HIGH/CRITICAL fails the job) — it scans
#    the repo's own lockfiles/Dockerfiles, not third-party infra, so a red trivy is
#    always actionable by the repo itself.
name: security-shared
on:
  workflow_call:
    inputs:
      language:
        type: string
        default: "javascript-typescript"
      skip-codeql:
        type: boolean
        default: false
      preview_url:
        type: string
        default: ""
        description: >
          PR preview URL for the ZAP baseline scan (e.g. https://pr-123-lizensa.previews.softblaze.net).
          Leave empty to skip the zap-baseline job entirely — it does not run without a target.

jobs:
  gitleaks:
    runs-on: coolify-ci
    timeout-minutes: 5
    # Surface the secret into a job-level env var so step `if:` conditions can read
    # it (GitHub Actions forbids `secrets.*` directly inside `if:`).
    env:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # gitleaks-action@v2 requires a paid GITLEAKS_LICENSE for ORG repos. When the
      # license secret is present, use the action (richer reporting). Otherwise fall
      # back to the free open-source gitleaks binary so secret scanning still runs.
      - name: gitleaks (licensed action)
        if: ${{ env.GITLEAKS_LICENSE != '' }}
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      - name: gitleaks (free binary fallback)
        if: ${{ env.GITLEAKS_LICENSE == '' }}
        shell: bash
        run: |
          VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          # Advisory: report findings but do not fail the workflow. Hard-blocking on
          # secret detection without triage/allowlisting causes false-positive churn.
          /tmp/gitleaks detect --source . --redact --no-banner --exit-code 0 \
            --report-format sarif --report-path gitleaks.sarif || true
          COUNT=$(jq '[.runs[]?.results[]?] | length' gitleaks.sarif 2>/dev/null || echo 0)
          echo "gitleaks: $COUNT potential finding(s)"
          if [ "$COUNT" -gt "0" ]; then
            echo "::warning::gitleaks flagged $COUNT potential secret(s) — review gitleaks.sarif"
          fi

  npm-audit:
    runs-on: coolify-ci
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # 2026-07-28: not every consuming repo uses pnpm (e.g. liveagent-ai is
      # plain npm/package-lock.json). pnpm/action-setup hard-fails on a repo
      # with no packageManager field and no pnpm-lock.yaml -- that failure
      # happens before the audit script's own advisory `|| true` can help, so
      # the package-manager choice has to be made up front.
      - name: Detect package manager
        id: pkgmgr
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
          else
            echo "manager=npm" >> "$GITHUB_OUTPUT"
          fi
      # No version pin: pnpm/action-setup reads each repo's package.json
      # "packageManager" field. Pinning a major (e.g. "9") conflicts with a
      # precise packageManager value (e.g. pnpm@9.15.4) and fails with
      # ERR_PNPM_BAD_PM_VERSION before the audit can run.
      - uses: pnpm/action-setup@v4
        if: steps.pkgmgr.outputs.manager == 'pnpm'
      # No `cache: pnpm` here: the audit doesn't need a warm store and the cache
      # Post-step has been flaky (fails the job after an otherwise-green audit).
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Audit (advisory only — never fails the workflow)
        shell: bash
        run: |
          # Advisory: print but don't fail. Real fix path is Dependabot PRs.
          if [ "${{ steps.pkgmgr.outputs.manager }}" = "pnpm" ]; then
            pnpm audit --prod --json > audit.json 2>&1 || true
            HIGH=$(jq '[.advisories[]? | select(.severity=="high")] | length' audit.json 2>/dev/null || echo 0)
            CRIT=$(jq '[.advisories[]? | select(.severity=="critical")] | length' audit.json 2>/dev/null || echo 0)
          else
            npm audit --omit=dev --json > audit.json 2>&1 || true
            HIGH=$(jq '.metadata.vulnerabilities.high // 0' audit.json 2>/dev/null || echo 0)
            CRIT=$(jq '.metadata.vulnerabilities.critical // 0' audit.json 2>/dev/null || echo 0)
          fi
          echo "Audit (${{ steps.pkgmgr.outputs.manager }}): $CRIT critical, $HIGH high"
          if [ "$CRIT" -gt "0" ]; then
            echo "::warning::$CRIT critical npm advisories — open a Dependabot PR or update manually"
          fi

  trivy:
    # dev-environment-research-2026-09-24.md item #7. HIGH/CRITICAL fails the job — unlike the
    # other advisory jobs here, this one scans only the calling repo's OWN lockfiles/Dockerfiles,
    # so a red result is always something the repo itself can fix, not an org/licensing gap.
    runs-on: coolify-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The beast-gha-runner image (tools/install-dev-test-clis.sh) pre-pulls trivy's vuln DB at
      # build time into TRIVY_CACHE_DIR with TRIVY_SKIP_DB_UPDATE=true already set — this job never
      # hits the network for the DB itself, only for `trivy fs`'s own repo scan.
      - name: trivy fs (vuln, secret, misconfig)
        shell: bash
        run: |
          trivy fs \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --skip-db-update \
            . 2>&1 | tee trivy.log
          echo "trivy: scan complete — see the step log above for any HIGH/CRITICAL findings"

  zap-baseline:
    # Optional, non-blocking at first (dev-environment-research item #7 / install-order day 9):
    # only runs when the caller passes a preview_url (e.g. once a PR is Ready for review and its
    # Coolify preview is live). `continue-on-error` until findings have been triaged org-wide.
    if: ${{ inputs.preview_url != '' }}
    runs-on: coolify-ci
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ inputs.preview_url }}
          cmd_options: "-z '-silent'"
          fail_action: false

  codeql:
    if: ${{ !inputs.skip-codeql }}
    runs-on: coolify-ci
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ inputs.language }}
      # SARIF upload requires "Code Security" (code scanning) enabled on the repo.
      # When it's off, analyze runs fine but the upload errors with a configuration
      # error. continue-on-error keeps the gate green; findings still upload once the
      # repo setting is enabled. Flip this to a hard failure org-wide after enabling.
      - uses: github/codeql-action/analyze@v3
        continue-on-error: true
        with:
          category: "/language:${{ inputs.language }}"
